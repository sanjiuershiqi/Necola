name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  VCPKG_DEFAULT_TRIPLET: x86-windows
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      # xmake's own package/repo cache. Keyed on the lock file so a dependency
      # change invalidates it, with a prefix fallback so a new lock still gets a
      # warm cache instead of a cold download of everything.
      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.xmake/cache
            ~/.xmake/repositories
          key: xmake-${{ runner.os }}-${{ hashFiles('xmake-requires.lock', 'xmake.lua') }}
          restore-keys: |
            xmake-${{ runner.os }}-

      # The build directory is restored so xmake can rebuild only the files that
      # actually changed instead of the whole project on every push.
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-inipp-x86-windows-${{ runner.os }}-20260812

      - name: Bootstrap vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          & vcpkg\bootstrap-vcpkg.bat -disableMetrics
          & vcpkg\vcpkg.exe install inipp:x86-windows

      - name: Show vcpkg list
        shell: pwsh
        run: |
          & vcpkg\vcpkg.exe list

      - name: Configure (release, x86)
        shell: pwsh
        run: xmake f -m release -p windows -a x86 -y -v

      - name: Build
        shell: pwsh
        run: |
          # -j0 asks xmake for one job per logical CPU; --rebuild is deliberately
          # NOT used so a restored build directory gives an incremental build.
          xmake -y -v -j0

      - name: Locate artifact
        id: artifact
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter "necola_ads.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "necola_ads.dll not found in build/" }
          "path=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Built: $($dll.FullName)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: necola_ads-${{ github.sha }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          name: ${{ github.ref_name }}
